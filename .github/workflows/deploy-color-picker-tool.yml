name: Deploy Color Picker Tool to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "04_Color_Picker_Tool/**"
      - ".github/workflows/deploy-color-picker-tool.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-color-picker-tool
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_Color_Picker_Tool

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04_Color_Picker_Tool/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p ../github-pages-artifact/04_Color_Picker_Tool
          cp -R out/. ../github-pages-artifact/04_Color_Picker_Tool

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}04_Color_Picker_Tool/
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
