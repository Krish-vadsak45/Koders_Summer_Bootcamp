name: Deploy Tip Calculator to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "06_Tip_Calculator/**"
      - ".github/workflows/deploy-tip-calculator.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-tip-calculator
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06_Tip_Calculator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 06_Tip_Calculator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p ../github-pages-artifact/06_Tip_Calculator
          cp -R out/. ../github-pages-artifact/06_Tip_Calculator

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}06_Tip_Calculator/
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
