name: Deploy Utility Toolkit to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "07_Utility_Toolkit/**"
      - ".github/workflows/deploy-utility-toolkit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-utility-toolkit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_Utility_Toolkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 07_Utility_Toolkit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p ../github-pages-artifact/07_Utility_Toolkit
          cp -R out/. ../github-pages-artifact/07_Utility_Toolkit

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}07_Utility_Toolkit/
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
