name: Deploy Project 17 Only

on:
  push:
    branches: ["main"]
    paths:
      - '17_Search_Functionality_Using_API/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Project 17
        run: |
          cd 17_Search_Functionality_Using_API
          npm install --production=false
          GITHUB_PAGES=true NEXT_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} npm run build
          rm -rf node_modules

      - name: Prepare GitHub Pages structure
        run: |
          mkdir -p final-site/Koders_Summer_Bootcamp
          cp -R 17_Search_Functionality_Using_API/out final-site/Koders_Summer_Bootcamp/17_Search_Functionality_Using_API

      - uses: actions/upload-pages-artifact@v3
        with:
          path: final-site

      - uses: actions/deploy-pages@v4
