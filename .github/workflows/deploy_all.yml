name: Deploy All Projects

on:
  workflow_dispatch: # Disabled by default, enable manually if needed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build All Projects
        run: |
          mkdir -p final-site
          PROJECTS=("01_Simple_Digital_Clock" "03_Password_Generator" "04_Color_Picker_Tool" "05_BMI_Calculator" "06_Tip_Calculator" "07_Utility_Toolkit" "08_Discord_Landing_Page_Clone" "09_Spotify_Landing_Page_Clone" "10_Responsive_Navbar" "11_Image_Slider" "12_Weather_App" "13_Currency_Converter" "14_Productivity_Dashboard" "15_Bug_Fix_Of_12_Weather_App" "16_Dark_Light_Mode_Toggle_Switch" "17_Search_Functionality_Using_API" "18_Filtering_Functionality_Using_API" "19_Login_Page" "20_Signup_Page" "21_Productivity_Dashboard" "22_Expense_Tracker" "23_Habit_Tracker" "24_Github_Profile_Finder")

          for folder in "${PROJECTS[@]}"; do
            if [ -d "$folder" ]; then
              cd "$folder"
              # Static HTML projects (09, 12, 15, 16) don't need build step
              if [ "$folder" == "09_Spotify_Landing_Page_Clone" ] || [ "$folder" == "12_Weather_App" ] || [ "$folder" == "15_Bug_Fix_Of_12_Weather_App" ] || [ "$folder" == "16_Dark_Light_Mode_Toggle_Switch" ]; then
                mkdir -p ../final-site/$folder
                # Copy only necessary files, exclude node_modules, .git, etc.
                rsync -av --progress ./ ../final-site/$folder/ \
                  --exclude 'node_modules' \
                  --exclude '.git' \
                  --exclude '.next' \
                  --exclude 'dist' \
                  --exclude 'out' \
                  --exclude '.env*' \
                  --exclude 'package-lock.json' \
                  --exclude '.DS_Store' \
                  --exclude 'Thumbs.db' || cp -R * ../final-site/$folder/
              else
                npm install --production=false
                GITHUB_PAGES=true NEXT_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} npm run build
                # Clean up node_modules after build to save space
                rm -rf node_modules
                # Vite projects use 'dist', Next.js projects use 'out'
                if [ "$folder" == "08_Discord_Landing_Page_Clone" ]; then
                  cp -R dist/. ../final-site/$folder
                  rm -rf dist
                elif [ "$folder" == "10_Responsive_Navbar" ]; then
                  cp -R public/. ../final-site/$folder
                else
                  cp -R out/. ../final-site/$folder
                  rm -rf out
                fi
              fi
              cd ..
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: final-site
      - uses: actions/deploy-pages@v4
