name: Deploy All Projects

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build All
        run: |
          mkdir -p final-site
          PROJECTS=("01_Simple_Digital_Clock" "03_Password_Generator" "04_Color_Picker_Tool" "05_BMI_Calculator" "06_Tip_Calculator" "07_Utility_Toolkit" "08_Discord_Landing_Page_Clone" "09_Spotify_Landing_Page_Clone" "10_Responsive_Navbar" "11_Image_Slider" "12_Weather_App" "13_Currency_Converter" "14_Productivity_Dashboard")
          
          for folder in "${PROJECTS[@]}"; do
            if [ -d "$folder" ]; then
              cd "$folder"
              # Static HTML projects (09, 12) don't need build step
              if [ "$folder" == "09_Spotify_Landing_Page_Clone" ] || [ "$folder" == "12_Weather_App" ]; then
                mkdir -p ../final-site/$folder
                cp -R . ../final-site/$folder/
              else
                npm install
                GITHUB_PAGES=true npm run build
                # Vite projects use 'dist', Next.js projects use 'out'
                if [ "$folder" == "08_Discord_Landing_Page_Clone" ]; then
                  cp -R dist/. ../final-site/$folder
                elif [ "$folder" == "10_Responsive_Navbar" ]; then
                  cp -R public/. ../final-site/$folder
                else
                  cp -R out/. ../final-site/$folder
                fi
              fi
              cd ..
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: final-site
      - uses: actions/deploy-pages@v4