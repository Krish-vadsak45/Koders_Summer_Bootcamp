name: Deploy Project 18 to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Project 18
        run: |
          cd 18_Filtering_Functionality_Using_API
          npm install --production=false
          GITHUB_PAGES=true NEXT_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} npm run build
          rm -rf node_modules

      - name: Prepare GitHub Pages structure
        run: |
          mkdir -p final-site/Koders_Summer_Bootcamp
          cp -R 18_Filtering_Functionality_Using_API/out final-site/Koders_Summer_Bootcamp/18_Filtering_Functionality_Using_API

      - uses: actions/upload-pages-artifact@v3
        with:
          path: final-site

      - uses: actions/deploy-pages@v4
